<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title description">
  <title id="title">Smart wearable prototype architecture</title>
  <desc id="description">Three I2C sensors connect to a Raspberry Pi Zero W, which records CSV data and serves Node-RED visualizations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="650" rx="28" fill="#f8fafc"/>
  <text x="70" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Prototype data path</text>
  <text x="70" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#64748b">Paper configuration and recovered software boundary</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="150" width="290" height="105" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="70" y="150" width="12" height="105" rx="6" fill="#2563eb"/>
    <text x="105" y="190" font-size="21" font-weight="700" fill="#0f172a">MPU9250 / MPU6050</text>
    <text x="105" y="220" font-size="16" fill="#475569">Motion and orientation</text>
    <text x="105" y="244" font-size="14" fill="#2563eb">I2C 0x68</text>

    <rect x="70" y="285" width="290" height="105" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect x="70" y="285" width="12" height="105" rx="6" fill="#f97316"/>
    <text x="105" y="325" font-size="21" font-weight="700" fill="#0f172a">MLX90614</text>
    <text x="105" y="355" font-size="16" fill="#475569">Ambient and object temperature</text>
    <text x="105" y="379" font-size="14" fill="#ea580c">I2C 0x5A</text>

    <rect x="70" y="420" width="290" height="105" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="70" y="420" width="12" height="105" rx="6" fill="#0f766e"/>
    <text x="105" y="460" font-size="21" font-weight="700" fill="#0f172a">MAX30100</text>
    <text x="105" y="490" font-size="16" fill="#475569">Raw red and infrared PPG</text>
    <text x="105" y="514" font-size="14" fill="#0f766e">I2C 0x57</text>

    <rect x="500" y="225" width="330" height="225" rx="22" fill="#0f172a"/>
    <text x="665" y="285" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Raspberry Pi Zero W</text>
    <text x="665" y="325" text-anchor="middle" font-size="17" fill="#cbd5e1">Sample and validate</text>
    <text x="665" y="358" text-anchor="middle" font-size="17" fill="#cbd5e1">Apply rolling mean</text>
    <text x="665" y="391" text-anchor="middle" font-size="17" fill="#cbd5e1">Timestamp and serialize</text>
    <rect x="550" y="414" width="230" height="3" rx="2" fill="#38bdf8"/>

    <rect x="980" y="155" width="330" height="105" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="980" y="155" width="12" height="105" rx="6" fill="#7c3aed"/>
    <text x="1015" y="198" font-size="21" font-weight="700" fill="#0f172a">CSV recordings</text>
    <text x="1015" y="230" font-size="16" fill="#475569">Local evidence and later analysis</text>

    <rect x="980" y="290" width="330" height="105" rx="16" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <rect x="980" y="290" width="12" height="105" rx="6" fill="#e11d48"/>
    <text x="1015" y="333" font-size="21" font-weight="700" fill="#0f172a">Node-RED</text>
    <text x="1015" y="365" font-size="16" fill="#475569">Flow processing and browser views</text>

    <rect x="980" y="425" width="330" height="105" rx="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <rect x="980" y="425" width="12" height="105" rx="6" fill="#0284c7"/>
    <text x="1015" y="468" font-size="21" font-weight="700" fill="#0f172a">Local display and shell</text>
    <text x="1015" y="500" font-size="16" fill="#475569">Bench feedback during acquisition</text>
  </g>

  <path d="M360 202 H430 V337 H490" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M360 337 H490" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M360 472 H430 V337" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="405" y="323" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">I2C</text>

  <path d="M840 337 H915 V207 H970" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M840 337 H970" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M840 337 H915 V477 H970" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="900" y="323" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">local / Wi-Fi</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
    <circle cx="78" cy="594" r="6" fill="#16a34a"/>
    <text x="94" y="599" fill="#475569">Recovered implementation evidence</text>
    <circle cx="380" cy="594" r="6" fill="#f59e0b"/>
    <text x="396" y="599" fill="#475569">Some source artifacts missing</text>
    <text x="1310" y="599" text-anchor="end" fill="#64748b">Research prototype, 2021</text>
  </g>
</svg>
