[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-smart-wearable-health-monitor"
version = "0.1.0"
description = "Raspberry Pi data acquisition software for a university wearable health-monitoring prototype"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Smart Wearable Monitoring and Diagnosing eHealth System team" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.optional-dependencies]
hardware = [
  "smbus2>=0.4,<1",
  "mpu9250-jmdev>=1.0,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
wearable-monitor = "wearable_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["legacy", ".qa"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
